<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages non répondus</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin-management.css">
    <style>
        .table-toolbar {
            display: flex;
            justify-content: flex-end;
            padding: 16px 18px 12px;
            background: #fff;
            border-bottom: 1px solid #ece9e1;
        }

        .search-field {
            display: flex;
            align-items: center;
            gap: 10px;
            width: min(100%, 420px);
            background: #f8f7f3;
            border: 1px solid #ece9e1;
            border-radius: 999px;
            padding: 10px 14px;
            color: #5F5E5A;
        }

        .search-field svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            flex-shrink: 0;
        }

        .search-field input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            color: #2C2C2A;
        }

        .search-field input::placeholder {
            color: #888780;
        }

        .pending-row {
            background: #fff1f2;
        }

        .pending-row td {
            color: #2C2C2A;
        }

        .pending-status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
            border-radius: 999px;
            background: #fdecec;
            color: #D85A30;
            font-size: 12px;
            font-weight: 700;
        }

        .message-content {
            max-width: 300px;
            white-space: normal;
            word-break: break-word;
            color: #5F5E5A;
            line-height: 1.5;
        }
    </style>
</head>
<body style="visibility: hidden;">
    <header class="navbar">
        <div class="nav-logo" onclick="window.location.href='admin-dashboard.html'">
            <img src="../images/ziguade-tour-logo.jpeg" alt="Logo AGORA">
        </div>

        <nav class="navbar-links">
            <a href="admins-management.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Gestion des admins
            </a>
            <a href="users-management.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                Gestion des utilisateurs
            </a>
            <a href="messages-management.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                Gestion des Messages
            </a>
            <a href="categories-management.html" class="nav-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Gestion des Catégories
            </a>
        </nav>

        <div class="navbar-right">
            <button id="toggleBtn" aria-label="Basculer le thème">🌙</button>
            <a href="login-admin.html" class="btn-logout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Déconnexion
            </a>
        </div>
    </header>

    <main class="container">
        <section class="page-header">
            <div>
                <p class="eyebrow">Messagerie</p>
                <h1>Messages non répondus</h1>
            </div>
            <a class="action-chip" href="messages-management.html">Voir tous les messages</a>
        </section>

        <section class="table-shell">
            <div class="table-toolbar">
                <label class="search-field" aria-label="Rechercher un message non répondu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="16.65" y1="16.65" x2="21" y2="21"></line>
                    </svg>
                    <input id="pendingSearchInput" type="search" placeholder="Rechercher un client ou un message..." autocomplete="off" />
                </label>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Client</th>
                        <th>Type</th>
                        <th>Message</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody id="pendingMessagesBody"></tbody>
            </table>
        </section>
    </main>

    <script src="../js/check-auth.js"></script>
    <script src="../js/categories-management.js"></script>
</body>
</html>
